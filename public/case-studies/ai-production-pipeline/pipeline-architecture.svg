<svg width="100%" viewBox="0 0 680 780" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<title>Two-layer AI production pipeline architecture</title>
<desc>Claude.ai handles direction and briefing, handing off a brief.json file to Claude Code, which executes a locked pipeline: HTML design, PDF export, Canva import, API content population, a human review checkpoint, and final approval. A revise loop returns from the review checkpoint back to the HTML design step.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="rgba(26,26,26,0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Claude.ai — a named role, marked with a heavier border -->
<rect x="60" y="40" width="260" height="56" fill="#F5F5F3" stroke="#1A1A1A" stroke-width="2"/>
<text x="190" y="60" text-anchor="middle" fill="#1A1A1A" font-size="13" font-weight="700" letter-spacing="1px">CLAUDE.AI</text>
<text x="190" y="78" text-anchor="middle" fill="#1A1A1A" opacity="0.55" font-size="11">Direction &amp; briefing</text>

<!-- Claude Code — a named role, marked with a heavier border -->
<rect x="360" y="40" width="260" height="56" fill="#F5F5F3" stroke="#1A1A1A" stroke-width="2"/>
<text x="490" y="60" text-anchor="middle" fill="#1A1A1A" font-size="13" font-weight="700" letter-spacing="1px">CLAUDE CODE</text>
<text x="490" y="78" text-anchor="middle" fill="#1A1A1A" opacity="0.55" font-size="11">Execution &amp; files</text>

<text x="340" y="60" text-anchor="middle" fill="#1A1A1A" opacity="0.55" font-size="10.5" letter-spacing="0.5px">brief.json</text>
<line x1="320" y1="68" x2="357" y2="68" stroke="rgba(26,26,26,0.45)" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="490" y1="96" x2="490" y2="137" stroke="rgba(26,26,26,0.45)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- HTML design -->
<rect x="340" y="140" width="300" height="56" fill="#F5F5F3" stroke="rgba(26,26,26,0.2)" stroke-width="1"/>
<text x="490" y="160" text-anchor="middle" fill="#1A1A1A" font-size="13" font-weight="700" letter-spacing="1px">HTML DESIGN</text>
<text x="490" y="178" text-anchor="middle" fill="#1A1A1A" opacity="0.55" font-size="11">Brand-consistent layout</text>
<line x1="490" y1="196" x2="490" y2="233" stroke="rgba(26,26,26,0.45)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- PDF export -->
<rect x="340" y="236" width="300" height="56" fill="#F5F5F3" stroke="rgba(26,26,26,0.2)" stroke-width="1"/>
<text x="490" y="256" text-anchor="middle" fill="#1A1A1A" font-size="13" font-weight="700" letter-spacing="1px">PDF EXPORT</text>
<text x="490" y="274" text-anchor="middle" fill="#1A1A1A" opacity="0.55" font-size="11">Headless Chromium, embedded fonts</text>
<line x1="490" y1="292" x2="490" y2="329" stroke="rgba(26,26,26,0.45)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Canva import -->
<rect x="340" y="332" width="300" height="56" fill="#F5F5F3" stroke="rgba(26,26,26,0.2)" stroke-width="1"/>
<text x="490" y="352" text-anchor="middle" fill="#1A1A1A" font-size="13" font-weight="700" letter-spacing="1px">CANVA IMPORT</text>
<text x="490" y="370" text-anchor="middle" fill="#1A1A1A" opacity="0.55" font-size="11">Locked visual layer</text>
<line x1="490" y1="388" x2="490" y2="425" stroke="rgba(26,26,26,0.45)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- API population -->
<rect x="340" y="428" width="300" height="56" fill="#F5F5F3" stroke="rgba(26,26,26,0.2)" stroke-width="1"/>
<text x="490" y="448" text-anchor="middle" fill="#1A1A1A" font-size="13" font-weight="700" letter-spacing="1px">API POPULATION</text>
<text x="490" y="466" text-anchor="middle" fill="#1A1A1A" opacity="0.55" font-size="11">Content via Canva MCP</text>
<line x1="490" y1="484" x2="490" y2="521" stroke="rgba(26,26,26,0.45)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Pending review — the one human gate, the single solid mark on the page -->
<rect x="340" y="524" width="300" height="56" fill="#1A1A1A" stroke="none"/>
<text x="490" y="544" text-anchor="middle" fill="#F5F5F3" font-size="13" font-weight="700" letter-spacing="1px">PENDING REVIEW</text>
<text x="490" y="562" text-anchor="middle" fill="#F5F5F3" opacity="0.7" font-size="11">Human checkpoint — nothing skips this</text>
<line x1="490" y1="580" x2="490" y2="617" stroke="rgba(26,26,26,0.45)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Approved — terminal state -->
<rect x="340" y="620" width="300" height="56" fill="#F5F5F3" stroke="#1A1A1A" stroke-width="2"/>
<text x="490" y="640" text-anchor="middle" fill="#1A1A1A" font-size="13" font-weight="700" letter-spacing="1px">APPROVED</text>
<text x="490" y="658" text-anchor="middle" fill="#1A1A1A" opacity="0.55" font-size="11">Client-facing, final</text>

<!-- Revision loop -->
<path d="M340,552 L40,552 L40,168 L338,168" fill="none" stroke="rgba(26,26,26,0.4)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="30" y="360" text-anchor="middle" fill="#1A1A1A" opacity="0.5" font-size="10.5" letter-spacing="0.5px" transform="rotate(-90 30 360)">REDIRECT FOR REVISION</text>

<!-- Legend -->
<line x1="340" y1="710" x2="340" y2="750" stroke="rgba(26,26,26,0.15)" stroke-width="1"/>
<rect x="360" y="716" width="14" height="14" fill="#1A1A1A"/>
<text x="382" y="727" fill="#1A1A1A" opacity="0.6" font-size="10.5">Solid = the one step a human has to sign off on. Everything else runs unattended.</text>

</svg>
